eholder-val=\"{{ false }}\">\n      <div style=\"width:310px;background:#FFFDF8;border:3px solid #171A46;border-radius:22px;box-shadow:6px 6px 0 #171A46;overflow:hidden;color:#171A46\">\n        <div style=\"background:#7655F5;color:#FFFDF8;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span style=\"width:30px;height:30px;border-radius:50%;background:#B9F56B;border:2.5px solid #171A46;display:inline-block\"><\u002Fspan>\n            <div><div class=\"thh\" style=\"font-size:15px\">DIVIZTY Chatbot<\u002Fdiv><div class=\"thb\" style=\"font-size:11px;opacity:.9\">ถามข้อมูลแต่ละฝ่ายได้เลย<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{toggle}}\" aria-label=\"ปิดแชต\" style=\"all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;background:#FFFDF8;color:#171A46;text-align:center;line-height:28px;font-weight:700\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:12px;display:flex;flex-direction:column;gap:8px;height:150px;overflow-y:auto;background:#FFFDF8\">\n          <sc-for list=\"{{msgs}}\" as=\"m\" hint-placeholder-count=\"2\">\n            <sc-if value=\"{{m.isBot}}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"thb\" style=\"align-self:flex-start;max-width:88%;background:#E9F6FF;border:2px solid #171A46;border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:14px;line-height:1.45\">{{m.text}}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{m.isMe}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"thb\" style=\"align-self:flex-end;max-width:88%;background:#FFE17A;border:2px solid #171A46;border-radius:16px 16px 4px 16px;padding:8px 12px;font-size:14px;line-height:1.45\">{{m.text}}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:0 12px 12px;display:flex;flex-wrap:wrap;gap:6px\">\n          <sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"3\">\n            <button type=\"button\" class=\"chip thb\" sc-camel-on-click=\"{{c.go}}\" style=\"all:unset;cursor:pointer;background:#FFFDF8;border:2px solid #171A46;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600\">{{c.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <button type=\"button\" sc-camel-on-click=\"{{toggle}}\" class=\"btn pulse\" aria-label=\"เปิดแชตบอท\" style=\"all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:9px;background:#B9F56B;border:3px solid #171A46;border-radius:999px 999px 999px 8px;padding:11px 20px;box-shadow:5px 5px 0 #171A46;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;color:#171A46\">\n      <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 5 h16 a2 2 0 0 1 2 2 v9 a2 2 0 0 1 -2 2 h-9 l-5 4 v-4 h-2 a2 2 0 0 1 -2 -2 v-9 a2 2 0 0 1 2 -2Z\" fill=\"#FFFDF8\" stroke=\"#171A46\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"9\" cy=\"11.5\" r=\"1.3\" fill=\"#171A46\"><\u002Fcircle><circle cx=\"15\" cy=\"11.5\" r=\"1.3\" fill=\"#171A46\"><\u002Fcircle><\u002Fsvg>\n      CHATBOT\n    <\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:810}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      open: false,\n      sel: -1,\n      msgs: [{ isBot: true, text: 'สวัสดี! อยากรู้เรื่องฝ่ายไหน ถามได้เลย' }]\n    };\n  }\n  renderVals() {\n    const deps = [\n      { title: 'ฝ่ายวิชาการ', bg: '#7655F5', fg: '#FFFDF8', desc: 'ดูแลเรื่องเรียนของนักเรียนทุกระดับชั้น ให้ทุกคนมีที่พึ่งเวลาติดขัด',\n        items: [{ t: 'ติวก่อนสอบโดยรุ่นพี่' }, { t: 'คลังชีทสรุปออนไลน์' }, { t: 'คลินิกการบ้านทุกสัปดาห์' }] },\n      { title: 'ฝ่ายกิจกรรม', bg: '#69C9FF', fg: '#171A46', desc: 'วางแผนและจัดกิจกรรมตลอดปีการศึกษา โดยให้นักเรียนมีส่วนร่วมตัดสินใจ',\n        items: [{ t: 'กีฬาสีและวันกิจกรรม' }, { t: 'โหวตกิจกรรมประจำเทอม' }, { t: 'เวทีให้ชมรมโชว์ผลงาน' }] },\n      { title: 'ฝ่ายสวัสดิการ', bg: '#FFE17A', fg: '#171A46', desc: 'ดูแลความเป็นอยู่ในโรงเรียนให้สะดวกสบายและปลอดภัยสำหรับทุกคน',\n        items: [{ t: 'ปรับปรุงโรงอาหารและมุมพักผ่อน' }, { t: 'ช่องทางแจ้งปัญหาแบบเป็นความลับ' }, { t: 'ติดตามเรื่องร้องเรียนจนจบ' }] },\n      { title: 'ฝ่ายประชาสัมพันธ์', bg: '#B9F56B', fg: '#171A46', desc: 'เล่าเรื่องราวของสภานักเรียนให้ทุกคนรู้ทันก่อนใคร ผ่านทุกช่องทาง',\n        items: [{ t: 'เพจและโซเชียลของสภา' }, { t: 'โปสเตอร์และเสียงตามสาย' }, { t: 'สรุปผลงานรายเดือน' }] }\n    ];\n    const ask = (q, a) => () => {\n      this.setState({ msgs: this.state.msgs.concat([{ isMe: true, text: q }, { isBot: true, text: a }]) });\n    };\n    const hasSel = this.state.sel >= 0;\n    const open = (i) => () => this.setState({ sel: i });\n    return {\n      open0: open(0), open1: open(1), open2: open(2), open3: open(3),\n      hasSel,\n      sel: hasSel ? deps[this.state.sel] : { items: [] },\n      closeSel: () => this.setState({ sel: -1 }),\n      isOpen: this.state.open,\n      toggle: () => this.setState({ open: !this.state.open }),\n      msgs: this.state.msgs,\n      chips: [\n        { label: 'ฝ่ายวิชาการทำอะไร?', go: ask('ฝ่ายวิชาการทำอะไร?', 'ติวสอบ แบ่งปันชีทสรุป และเปิดคลินิกการบ้านให้เพื่อนทุกคน') },\n        { label: 'ฝ่ายกิจกรรมมีอะไรบ้าง?', go: ask('ฝ่ายกิจกรรมมีอะไรบ้าง?', 'กีฬาสี วันกิจกรรม และกิจกรรมที่นักเรียนโหวตเลือกเอง') },\n        { label: 'ติดต่อสภายังไง?', go: ask('ติดต่อสภายังไง?', 'ดูช่องทางติดต่อ IG, Social media และ TikTok ได้ที่ส่วน contact ด้านล่าง') }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
